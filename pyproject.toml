[project]
name = "sim-skills-tools"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2,<3",
  "pillow>=10,<13",
  "scikit-image>=0.22,<1",
  "scipy>=1.10,<2",
  "tifffile>=2023.7",
]

[dependency-groups]
dev = ["pytest>=7,<9"]
